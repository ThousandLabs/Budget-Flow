<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Budget Flow — gestion financière personnelle et suivi de petits projets, 100 % local.">
<title>Budget Flow</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget Flow">
<!--
  ============================================================================
  BUDGET FLOW — Gestion financière personnelle & petits projets commerciaux
  ----------------------------------------------------------------------------
  • Fichier unique : HTML + CSS + JavaScript embarqués (aucune dépendance).
  • 100 % local : toutes les données sont dans le localStorage du navigateur.
  • Zéro inscription, zéro serveur, fonctionne hors ligne.
  • Sauvegarde / restauration par fichier JSON (Réglages).
  • Installable comme une application (PWA) : manifest.webmanifest + sw.js.

  Modules :
    1. Entrées & multi-projets commerciaux (+ convertisseur de devises)
    2. Sorties fixes & variables (enveloppes)
    3. Journal des dépenses en temps réel
    4. Projections dynamiques jour ⇄ semaine ⇄ mois + plafonds
    5. Mode survie (jours d'autonomie financière)
    6. Caisse de secours (épargne d'urgence isolée)
    7. Simulateur de fin de mois (achat test + scénarios)
    8. Bilan & rétrospective mensuelle
    9. Objectifs d'épargne & projets personnels
  ============================================================================
-->
<style>
/* ======================= 1. THÈME & VARIABLES ======================= */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#f6f8fb; --border:#e3e8ef;
  --text:#0f172a; --muted:#64748b;
  --primary:#0f766e; --primary-soft:#d5f5ef;
  --green:#15803d; --green-soft:#dcfce7;
  --red:#dc2626;   --red-soft:#fee2e2;
  --amber:#b45309; --amber-soft:#fef3c7;
  --blue:#2563eb;  --blue-soft:#dbeafe;
  --violet:#6d28d9;--violet-soft:#ede9fe;
  --radius:16px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05);
}
[data-theme="dark"]{
  --bg:#0a0f1c; --surface:#111827; --surface2:#0d1424; --border:#1f2a3c;
  --text:#e6ebf2; --muted:#8fa0b8;
  --primary:#2dd4bf; --primary-soft:#123f3b;
  --green:#4ade80; --green-soft:#14361f;
  --red:#f87171;   --red-soft:#3d1414;
  --amber:#fbbf24; --amber-soft:#3a2a08;
  --blue:#60a5fa;  --blue-soft:#14254a;
  --violet:#a78bfa;--violet-soft:#291d4d;
  --shadow:none;
}

/* ======================= 2. BASE ======================= */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .2s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.ic{flex-shrink:0;display:block}
b,strong{font-weight:700}

/* ======================= 3. MISE EN PAGE ======================= */
.app{display:flex;min-height:100vh}
.sidebar{display:none;position:sticky;top:0;height:100vh;width:250px;flex-shrink:0;flex-direction:column;gap:3px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 10px 20px;letter-spacing:-.02em}
.brand-logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#0f766e,#0ea5e9);display:grid;place-items:center;color:#fff}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px;text-align:left;width:100%;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--primary-soft);color:var(--primary)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
main{flex:1;min-width:0}
#view{max-width:1140px;margin:0 auto;padding:16px 16px 120px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bn-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:5px 0}
.bn-btn.active{color:var(--primary)}
.bn-add{width:54px;height:54px;margin:-24px auto 2px;border-radius:17px;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(15,118,110,.35)}
[data-theme="dark"] .bn-add{color:#06201d}
@media(min-width:900px){.sidebar{display:flex}.bottomnav{display:none}#view{padding:30px 34px 60px}}

/* ======================= 4. COMPOSANTS ======================= */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.page-head h1{font-size:25px;letter-spacing:-.025em;line-height:1.15}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:750;letter-spacing:-.01em}
.section{margin-top:24px}
.section-title{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}}
.g-journal{grid-template-columns:1fr;align-items:start}
@media(min-width:1000px){.g-journal{grid-template-columns:390px 1fr}}
.stat{padding:15px 16px}
.stat .k{font-size:12px;font-weight:650;color:var(--muted)}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.hero{background:linear-gradient(135deg,#0f766e 0%,#0e7490 100%);color:#fff;border:0}
.hero .k{opacity:.85;font-size:13px;font-weight:600}
.hero-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:13px;opacity:.95}
.hero-foot{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2);font-size:13px}
.big{font-size:34px;font-weight:850;letter-spacing:-.035em;line-height:1.1}
.big-s{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)} .muted{color:var(--muted)}
.hero .neg{color:#fecaca}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 16px;border-radius:11px;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--border);transition:transform .1s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
[data-theme="dark"] .btn-primary{color:#06201d}
.btn-danger{color:var(--red);border-color:var(--red-soft)}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.input{width:100%;height:44px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);outline:none;transition:border .15s,box-shadow .15s;font-size:16px;min-width:0}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--surface)}
.input-xl{height:62px;font-size:30px;font-weight:850;text-align:center;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:13px;font-weight:650;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:430px){.row3{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:7px;max-height:170px;overflow-y:auto;padding:2px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;user-select:none}
.chip input:checked+span{background:var(--primary);border-color:var(--primary);color:#fff}
[data-theme="dark"] .chip input:checked+span{color:#06201d}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .4s ease}
.progress.ok>i{background:var(--green)} .progress.mid>i{background:var(--amber)} .progress.bad>i{background:var(--red)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item-ic{width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.item-main{flex:1;min-width:0}
.item-title{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:12.5px;color:var(--muted)}
.item-amt{font-weight:750;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green)} .b-red{background:var(--red-soft);color:var(--red)}
.b-amber{background:var(--amber-soft);color:var(--amber)} .b-blue{background:var(--blue-soft);color:var(--blue)}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600}
.alert-red{background:var(--red-soft);color:var(--red)} .alert-amber{background:var(--amber-soft);color:var(--amber)}
.alert-blue{background:var(--blue-soft);color:var(--blue)} .alert-green{background:var(--green-soft);color:var(--green)}
.alert button{text-decoration:underline;font-weight:700}
.empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:14px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav b{min-width:130px;text-align:center;text-transform:capitalize;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:14px;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:0}
.kv.total{font-weight:800;font-size:16px;border-top:2px solid var(--border);border-bottom:0;padding-top:12px;margin-top:4px}
.calc-out{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px}
.flex{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between} .wrap{flex-wrap:wrap}
.mt{margin-top:12px} .mt2{margin-top:20px} .mt-s{margin-top:6px}
.hide-m{display:none} @media(min-width:900px){.hide-m{display:inline-flex}}
.rules{padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:430px){.mini-grid{grid-template-columns:repeat(2,1fr)}}
.mini{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.mini .k{font-size:11.5px;color:var(--muted);font-weight:650}
.mini .v{font-weight:800;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Stepper (multiplicateur de ventes) */
.svc{padding:12px 0;border-bottom:1px solid var(--border)}
.svc:last-child{border-bottom:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{width:36px;height:36px;font-size:19px;font-weight:700;background:var(--surface2)}
.stepper b{min-width:42px;text-align:center}

/* Mode survie */
.survival{border-left:5px solid var(--lv)}
.lvl-red{--lv:var(--red)} .lvl-amber{--lv:var(--amber)} .lvl-green{--lv:var(--green)} .lvl-blue{--lv:var(--blue)}
.surv-num{font-size:48px;font-weight:900;letter-spacing:-.05em;line-height:1;color:var(--lv)}
.surv-unit{font-weight:700;color:var(--muted)}
.surv-msg{font-weight:650;font-size:14.5px}
.surv-meta{font-size:13px;color:var(--muted);margin-top:8px}
.surv-tip{margin-top:10px;font-size:13px;background:var(--surface2);border-radius:10px;padding:8px 10px}

/* Caisse de secours (visuellement isolée) */
.vault{background:linear-gradient(160deg,#1e1b4b,#4c1d95);color:#fff;border:0;position:relative;overflow:hidden}
.vault::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;border:26px solid rgba(255,255,255,.06);pointer-events:none}
.vault .k{font-weight:700;font-size:14px}
.vault-sub{font-size:13px;opacity:.85}
.vault .progress{background:rgba(255,255,255,.15);border-color:transparent}
.vault .progress>i{background:#c4b5fd}
.vault-btn{background:#fff;color:#3b0764;border:0}
.vault-btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.vault-badge{background:rgba(255,255,255,.15);color:#fff}

/* Graphiques */
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;flex-shrink:0;margin:0 auto}
.donut-t1{font-size:4.6px;font-weight:800;fill:var(--text)}
.donut-t2{font-size:2.8px;fill:var(--muted)}
.legend{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend .row{display:flex;align-items:center;gap:8px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.stackbar span{display:block;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--border)}
.tbl .r{text-align:right;white-space:nowrap}
.scroll-x{overflow-x:auto}
.day-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:capitalize;padding:14px 0 2px}

/* Modale (feuille du bas sur mobile, centrée sur ordinateur) */
.modal{position:fixed;inset:0;z-index:50;display:none}
.modal.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(2,6,23,.55);animation:fade .2s}
.modal-panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
@media(min-width:700px){.modal-panel{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:540px;border-radius:20px;animation:pop .2s ease}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.modal-head h3{font-size:18px;letter-spacing:-.01em}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.more-grid .nav-btn{flex-direction:column;justify-content:center;text-align:center;padding:16px 6px;background:var(--surface2);font-size:12.5px;gap:8px}
.more-grid .nav-btn.active{background:var(--primary-soft)}

/* Notifications */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,430px);pointer-events:none}
@media(min-width:900px){.toasts{bottom:24px}}
.toast{background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s}
[data-theme="dark"] .toast{background:#e6ebf2;color:#0f172a}
.toast.err{background:#dc2626;color:#fff} .toast.warn{background:#b45309;color:#fff}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}

/* Écran d'activation */
#lock{display:none}
body.locked #lock{display:block}
body.locked .app,body.locked .bottomnav{display:none}
.lock-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 15% 0%,var(--primary-soft),transparent 55%),var(--bg)}
.lock-card{width:100%;max-width:450px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:26px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.lock-title{font-size:22px;letter-spacing:-.02em;line-height:1.2}
.steps{display:flex;flex-direction:column;gap:9px;font-size:14px}
.step{display:flex;gap:10px;align-items:flex-start}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.dev-box{background:var(--surface2);border:1px dashed var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.dev-id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:800;letter-spacing:.08em}
a.btn{text-decoration:none}
.btn-wa{background:#25d366;border-color:#25d366;color:#fff}
.code-input{text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.lock-foot{text-align:center;font-size:13px;color:var(--muted)}
.link-btn{color:var(--primary);font-weight:700;font-size:14px;text-decoration:underline}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* Guide d'utilisation */
.guide-item{border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.guide-item summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.guide-item summary::-webkit-details-marker{display:none}
.guide-item summary::after{content:"+";font-size:20px;color:var(--muted);font-weight:500}
.guide-item[open] summary::after{content:"−"}
.guide-body{padding:0 16px 16px;font-size:14px}
.guide-body p+p,.guide-body p+ul,.guide-body p+ol,.guide-body ul+p,.guide-body ol+p{margin-top:8px}
.guide-body ul,.guide-body ol{padding-left:20px;display:flex;flex-direction:column;gap:5px}

/* Impression du bilan */
@media print{
  .sidebar,.bottomnav,.no-print,.toasts,.modal{display:none!important}
  body{background:#fff;color:#000}
  #view{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid;border-color:#ddd}
}
.qr{display:block;width:100%;max-width:330px;height:auto;margin:12px auto;border-radius:14px;image-rendering:pixelated}
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:360px;margin:12px auto}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}

/* =========================================================================
   2 bis. LICENCE : CODE D'ACCÈS LIÉ À L'APPAREIL
   -------------------------------------------------------------------------
   • Au premier lancement, un « code appareil » aléatoire est créé (ex : BF-7KQ2-M9XA).
   • Le client l'envoie sur WhatsApp ; le vendeur génère le code d'activation
     correspondant avec le fichier « générateur » (qui partage la même clé).
   • La licence est stockée à part : « Tout effacer » ne la supprime pas.
   ========================================================================= */
const TEAM = 'Thousand Labs';
const CONTACT = '221711216581', CONTACT_FMT = '71\u00a0121\u00a065\u00a081';
const PRICE = '10\u00a0000\u00a0F';
const LIC_KEY = 'budgetflow_licence';
const ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
// Clé interne (doit être IDENTIQUE dans le générateur)
const _k = () => [84,76,45,66,70,45,50,48,50,54,45,120,81,55,109,90].map(c => String.fromCharCode(c)).join('') + '-flow';
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
const toAlpha = (n, len) => { let out = ''; for (let i = 0; i < len; i++) { out += ALPHA[n % ALPHA.length]; n = Math.floor(n / ALPHA.length); } return out; };
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function activationCode(dev) {
  const d = cleanCode(dev), k = _k();
  return (toAlpha(cyrb53(d + '|' + k, 7), 6) + toAlpha(cyrb53(k + '#' + d, 13), 6)).match(/.{4}/g).join('-');
}
function getLic() {
  let lic = {};
  try { lic = JSON.parse(localStorage.getItem(LIC_KEY)) || {}; } catch (e) {}
  if (!lic.dev) {
    const rnd = () => { let x = ''; for (let i = 0; i < 4; i++) x += ALPHA[Math.floor(Math.random() * ALPHA.length)]; return x; };
    lic = {dev: `BF-${rnd()}-${rnd()}`};
    try { localStorage.setItem(LIC_KEY, JSON.stringify(lic)); } catch (e) {}
  }
  return lic;
}
// Activation v2 : SIGNATURE NUMÉRIQUE (l'appli ne contient que la clé publique ; codes générés par Thousand Admin).
// Les appareils déjà activés avec l'ancien code restent valides.
const BF_PUB = {"kty": "EC", "crv": "P-256", "x": "pcF7mT3FVUz-KyYrnAS_KaplrCOu1NVeIPZrFN8MfiM", "y": "PCDYshME04Lczd0f_C6neNBZR0G7Canh4ROT-7hjhCs"};
let LIC_SIG_OK = false;
const legacyOk = l => !!l.code && cleanCode(l.code) === cleanCode(activationCode(l.dev));
const isActivated = () => legacyOk(getLic()) || LIC_SIG_OK;
const sigOf = s => String(s || '').replace(/\s+/g, '').replace(/^BFCODE:/i, '');
function unb64u(t){t=String(t).replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function checkSig(sig) {
  try {
    const c = sigOf(sig); if (!c || !(window.crypto && crypto.subtle)) return false;
    const k = await crypto.subtle.importKey('jwk', BF_PUB, {name: 'ECDSA', namedCurve: 'P-256'}, false, ['verify']);
    return await crypto.subtle.verify({name: 'ECDSA', hash: 'SHA-256'}, k, unb64u(c), new TextEncoder().encode(getLic().dev));
  } catch (e) { return false; }
}
function unlockApp() { document.body.classList.remove('locked'); $('#lock').innerHTML = ''; render(); toast('Budget Flow est activé. Bienvenue !'); }
/* ---------- QR code : générateur intégré (hors ligne) + lecteur caméra ---------- */
const QR=(()=>{
  const ECC={L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],M:[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]};
  const BLK={L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]};
  const FMT={L:1,M:0};
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const rawModules=v=>{let r=(16*v+128)*v+64;if(v>=2){const na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36}return r};
  const dataCw=(v,e)=>Math.floor(rawModules(v)/8)-ECC[e][v]*BLK[e][v];
  const alignPos=v=>{if(v===1)return [];const na=Math.floor(v/7)+2,size=v*4+17,step=v===32?26:Math.ceil((v*4+4)/(na*2-2))*2,r=[6];for(let p=size-7;r.length<na;p-=step)r.splice(1,0,p);return r};
  const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const rsRem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
  const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  function penalty(M,n){let p=0,dark=0;
    for(let a=0;a<n;a++){let rr=1,rc=1;for(let b=1;b<=n;b++){if(b<n&&M[a][b]===M[a][b-1])rr++;else{if(rr>=5)p+=rr-2;rr=1}if(b<n&&M[b][a]===M[b-1][a])rc++;else{if(rc>=5)p+=rc-2;rc=1}}}
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(M[y][x])dark++;if(y<n-1&&x<n-1){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}}
    return p+Math.max(0,Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10}
  function encode(text,e){e=e||'L';const bytes=Array.from(new TextEncoder().encode(text));let v=1,cap=0;
    for(;v<=40;v++){cap=dataCw(v,e)*8;if(4+(v<10?8:16)+bytes.length*8<=cap)break}
    if(v>40)throw new Error('Données trop longues pour un QR code');
    const bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    const nb=BLK[e][v],el=ECC[e][v],raw=Math.floor(rawModules(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-el+(i<nShort?0:1));k+=dat.length;const ec=rsRem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ec))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-el||j>=nShort)all.push(b[i])});
    const size=v*4+17,M=Array.from({length:size},()=>new Array(size).fill(false)),F=Array.from({length:size},()=>new Array(size).fill(false));
    const setF=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    [[3,3],[size-4,3],[3,size-4]].forEach(([cx,cy])=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=cx+dx,yy=cy+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size){const d=Math.max(Math.abs(dx),Math.abs(dy));setF(xx,yy,d!==2&&d!==4)}}});
    const ap=alignPos(v),na=ap.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setF(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    const drawFmt=m=>{const d=FMT[e]<<3|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)setF(8,i,g(i));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));for(let i=9;i<15;i++)setF(14-i,8,g(i));
      for(let i=0;i<8;i++)setF(size-1-i,8,g(i));for(let i=8;i<15;i++)setF(8,size-15+i,g(i));setF(8,size-8,true)};
    drawFmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bt=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);setF(a,c,bt);setF(c,a,bt)}}
    let idx=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&idx<all.length*8){M[y][x]=((all[idx>>>3]>>>(7-(idx&7)))&1)!==0;idx++}}}
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MASKS[m](x,y))M[y][x]=!M[y][x]};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){apply(m);drawFmt(m);const p=penalty(M,size);if(p<bp){bp=p;best=m}apply(m)}
    apply(best);drawFmt(best);return M}
  function canvas(text,px,e){const q=encode(text,e),n=q.length,quiet=4,total=n+quiet*2,scale=Math.max(2,Math.floor((px||300)/total)),c=document.createElement('canvas');
    c.width=c.height=total*scale;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';
    for(let y=0;y<n;y++)for(let xx=0;xx<n;xx++)if(q[y][xx])x.fillRect((xx+quiet)*scale,(y+quiet)*scale,scale,scale);c.className='qr';return c}

let scanStream=null,scanTimer=null;
function loadJsQR(){return new Promise((ok,ko)=>{if(window.jsQR)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=()=>window.jsQR?ok():ko();s.onerror=ko;document.head.appendChild(s)})}
async function startScan(video,status,onText){
  stopScan();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='📵 Caméra non disponible ici. Ouvre l\'appli installée (site en https).';return}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){status.textContent='📵 Accès à la caméra refusé. Autorise-le dans les réglages du navigateur.';return}
  video.setAttribute('playsinline','');video.muted=true;video.srcObject=scanStream;try{await video.play()}catch(e){}
  let detect=null;
  if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['qr_code']});detect=async()=>{const r=await bd.detect(video);return r.length?r[0].rawValue:null}}catch(e){detect=null}}
  if(!detect){status.textContent='Chargement du lecteur…';try{await loadJsQR()}catch(e){status.textContent='❌ Lecteur QR indisponible hors ligne sur ce téléphone. Utilise le message ou le fichier.';stopScan();return}
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    detect=async()=>{const w=video.videoWidth,h=video.videoHeight;if(!w)return null;const s=Math.min(1,720/Math.max(w,h));cv.width=w*s|0;cv.height=h*s|0;cx.drawImage(video,0,0,cv.width,cv.height);const r=window.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});return r?r.data:null}}
  if(!scanStream)return;
  status.textContent='🎯 Vise le QR code…';
  let busy=false;scanTimer=setInterval(async()=>{if(busy||!scanStream)return;busy=true;try{const t=await detect();if(t)onText(t)}catch(e){}busy=false},160);
}

   3. CALCULS FINANCIERS
   ========================================================================= */
const catById = id => D.categories.find(c => c.id === id) || {id, name: 'Sans catégorie', icon: '•', kind: 'variable', budget: 0};
// Revenu net en FCFA après conversion et frais de transfert / change
const incomeGross = i => i.amount * (i.currency === 'FCFA' ? 1 : i.rate);
const incomeNet = i => Math.max(0, incomeGross(i) * (1 - (i.feePct || 0) / 100) - (i.feeFixed || 0));
const emergencyBalance = () => sum(D.emergency, h => h.amount);
const goalSaved = g => sum(g.history, h => h.amount);
const goalsTotal = () => sum(D.goals, goalSaved);
const spentBetween = (a, b) => sum(D.expenses.filter(e => e.date >= a && e.date <= b), e => e.amount);
const isFixed = id => catById(id).kind === 'fixe';
const varSpentBetween = (a, b) => sum(D.expenses.filter(e => e.date >= a && e.date <= b && !isFixed(e.catId)), e => e.amount);
const qtyMonth = (sid, mk) => sum(D.sales.filter(s => s.serviceId === sid && s.date.startsWith(mk)), s => s.qty);
const caMonth = (sid, mk) => sum(D.sales.filter(s => s.serviceId === sid && s.date.startsWith(mk)), s => s.qty * s.price);

// Solde disponible = solde initial + entrées − dépenses − argent mis de côté (caisse + objectifs)
function totals() {
  const inc = sum(D.incomes, incomeNet);
  const sales = sum(D.sales, s => s.qty * s.price);
  const exp = sum(D.expenses, e => e.amount);
  const em = emergencyBalance(), gl = goalsTotal();
  return {inc, sales, exp, em, gl, balance: D.settings.initialBalance + inc + sales - exp - em - gl};
}

// Statistiques d'un mois donné
function monthStats(mk) {
  const inc = sum(D.incomes.filter(i => i.date.startsWith(mk)), incomeNet);
  const salesList = D.sales.filter(s => s.date.startsWith(mk));
  const sales = sum(salesList, s => s.qty * s.price);
  const expenses = D.expenses.filter(e => e.date.startsWith(mk));
  const byCat = {}; let fixed = 0, variable = 0;
  expenses.forEach(e => {
    byCat[e.catId] = (byCat[e.catId] || 0) + e.amount;
    if (catById(e.catId).kind === 'fixe') fixed += e.amount; else variable += e.amount;
  });
  const em = sum(D.emergency.filter(h => h.date.startsWith(mk)), h => h.amount);
  const gl = sum(D.goals, g => sum(g.history.filter(h => h.date.startsWith(mk)), h => h.amount));
  return {inc, sales, salesList, inTotal: inc + sales, exp: fixed + variable, fixed, variable, byCat, em, gl, saved: em + gl, count: expenses.length, expenses};
}

// Rythme de consommation quotidien (charges fixes lissées + variables réelles des 30 derniers jours)
function burnRate() {
  const t = today(), from = addDays(t, -29);
  const fixedIds = new Set(D.categories.filter(c => c.kind === 'fixe').map(c => c.id));
  const fixedBudget = sum(D.categories.filter(c => c.kind === 'fixe'), c => c.budget);
  const varBudget = sum(D.categories.filter(c => c.kind !== 'fixe'), c => c.budget);
  const varAll = D.expenses.filter(e => !fixedIds.has(e.catId));
  const varRecent = varAll.filter(e => e.date >= from && e.date <= t);
  let varDaily, source;
  if (varRecent.length) {
    const first = varAll.map(e => e.date).sort()[0];
    const span = clamp(diffDays(first, t) + 1, 7, 30); // au moins 7 jours pour éviter les extrapolations absurdes
    varDaily = sum(varRecent, e => e.amount) / span; source = 'réel';
  } else { varDaily = varBudget / PER.mois; source = 'budget'; }
  let fixedDaily = fixedBudget / PER.mois;
  if (!fixedBudget) fixedDaily = sum(D.expenses.filter(e => fixedIds.has(e.catId) && e.date >= from && e.date <= t), e => e.amount) / 30;
  return {daily: fixedDaily + varDaily, fixedDaily, varDaily, source};
}

// Mode survie : nombre de jours d'autonomie restants
function survival() {
  const bal = totals().balance, em = emergencyBalance(), b = burnRate();
  if (b.daily <= 0) return {noData: true, bal, em, b};
  const days = bal <= 0 ? 0 : Math.floor(bal / b.daily);
  const withEm = Math.floor(Math.max(0, bal + em) / b.daily);
  return {days, withEm, end: addDays(today(), days), bal, em, b};
}

// Dépenses essentielles mensuelles (base de l'objectif de la caisse de secours)
const essentialMonthly = () => {
  const b = sum(D.categories, c => c.budget);
  return b > 0 ? b : burnRate().daily * PER.mois;
};

// Base du simulateur de fin de mois
function simBase() {
  const mk = curMonth(), t = totals(), ms = monthStats(mk), b = burnRate();
  const daysLeft = daysInMonth(mk) - parseD(today()).getDate();
  const expectedInc = sum(D.sources.filter(s => !D.incomes.some(r => r.sourceId === s.id && r.date.startsWith(mk))), incomeNet);
  const fixedLeft = sum(D.categories.filter(c => c.kind === 'fixe'), c => Math.max(0, c.budget - (ms.byCat[c.id] || 0)));
  const varProj = b.varDaily * daysLeft;
  return {balance: t.balance, expectedInc, fixedLeft, varProj, varDaily: b.varDaily, daily: b.daily, daysLeft, end: t.balance + expectedInc - fixedLeft - varProj};
}
const scnNet = () => sum(D.scenarios.filter(s => s.active), s => s.type === 'revenu' ? s.amount : -s.amount);

    : d < 7 ? ['red', 'Critique', "Alerte rouge : moins d'une semaine d'autonomie. Coupez tout ce qui n'est pas vital."]

  return `<div class="card survival lvl-${lv[0]}">

function getAlerts() {
  const a = [], caps = D.settings.caps, ms = monthStats(curMonth()), sv = survival();
  const sT = varSpentBetween(today(), today()), sW = varSpentBetween(weekStart(), today());
  const dom = parseD(today()).getDate(), dim = daysInMonth(curMonth());
  if (!sv.noData && sv.bal > 0 && sv.days < 7) a.push(['red', `Autonomie critique : ${sv.days} jour(s) de survie financière restants.`]);
  if (caps.day && sT > caps.day) a.push(['red', `Plafond journalier dépassé de ${fmt(sT - caps.day)}.`]);
  if (caps.week && sW > caps.week) a.push(['red', `Plafond hebdomadaire dépassé de ${fmt(sW - caps.week)}.`]);
  if (caps.month && ms.variable > caps.month) a.push(['red', `Plafond mensuel dépassé de ${fmt(ms.variable - caps.month)}.`]);
  else if (caps.month && dom > 3) {
    const proj = ms.variable / dom * dim;
    if (proj > caps.month) a.push(['amber', `À ce rythme, vos dépenses variables atteindront ~${fmt(proj)} ce mois (plafond : ${fmt(caps.month)}).`]);
  }
  D.categories.filter(c => c.budget > 0 && (ms.byCat[c.id] || 0) > c.budget)
    .forEach(c => a.push(['amber', `${c.icon} ${esc(c.name)} : enveloppe dépassée de ${fmt(ms.byCat[c.id] - c.budget)}.`]));

function projectCard(name) {
  const mk = curMonth(), svcs = D.services.filter(s => s.project === name);
  let ca = 0, marge = 0, vol = 0, caAll = 0;
  const rows = svcs.map(s => {
    const q = qtyMonth(s.id, mk), c = caMonth(s.id, mk);
    ca += c; vol += q; marge += c - q * (s.cost || 0);
    caAll += sum(D.sales.filter(x => x.serviceId === s.id), x => x.qty * x.price);
    return `<div class="svc">
      <div class="flex between" style="gap:10px">
        <div class="item-main"><div class="item-title">${esc(s.name)}</div><div class="item-sub">${fmt(s.price)} / unité${s.cost ? ` · coût ${fmt(s.cost)}` : ''}</div></div>
        <div class="stepper"><button data-action="sale-minus" data-id="${s.id}" aria-label="Retirer une vente">−</button><b>${q}</b><button data-action="sale-plus" data-id="${s.id}" aria-label="Ajouter une vente">+</button></div>
      </div>
      <div class="flex between mt-s">
        <span class="item-sub">${fmt(s.price)} × ${q} = <b class="pos">${fmt(c)}</b></span>
        <span class="flex" style="gap:2px"><button class="btn btn-sm" data-action="sale-n" data-id="${s.id}">× N</button><button class="icon-btn" data-action="edit-service" data-id="${s.id}">${icon('edit', 16)}</button></span>
      </div></div>`;
  }).join('');
  return `<div class="card">
    <div class="card-head"><div><h2>${esc(name)}</h2><div class="item-sub">${vol} réalisation(s) ce mois · marge estimée ${fmt(marge)}</div><div class="item-sub">Cumul depuis le début : ${fmt(caAll)}</div></div><div class="big-s pos">${fmt(ca)}</div></div>
    ${rows}</div>`;
}

function convHtml(amount, cur, rate, pct, fix) {
  const gross = amount * rate, fees = gross * pct / 100 + fix, net = Math.max(0, gross - fees);
  return `<div class="kv"><span>Montant converti</span><b>${fmt(gross)}</b></div>
    <div class="kv"><span>Frais totaux</span><b class="neg">−${fmt(fees)}</b></div>
    <div class="kv total"><span>Vous recevez</span><span class="pos">${fmt(net)}</span></div>
    ${cur === 'EUR' ? `<div class="hint mt-s">Parité fixe : 1 € = 655,957 F CFA. Seuls les frais varient.</div>` : `<div class="hint mt-s">Taux indicatif : mettez-le à jour selon votre opérateur.</div>`}`;
}

/* ---------- MODULE 2 : SORTIES (FIXES & VARIABLES) ---------- */
views.sorties = () => {

  const reste = expected - bF - bV;
  return `
  ${head('Module 2', 'Sorties', 'Charges incompressibles et enveloppes variables, en budget mensuel.', `<button class="btn btn-primary" data-action="add-cat" data-id="variable">${icon('plus', 17)} Catégorie</button>`)}

  ${expected && reste < 0 ? `<div class="alert alert-red mt">${icon('shield', 18)}<span>Vos budgets dépassent vos revenus réguliers de ${fmt(-reste)}. Réduisez une enveloppe ou augmentez vos entrées.</span></div>` : ''}

};

function catRow(c, ms) {
  const sp = ms.byCat[c.id] || 0, b = c.budget, p = b ? sp / b * 100 : 0;

function journalList() {
  const q = state.jq.trim().toLowerCase();

/* ---------- MODULE 4 : PROJECTIONS DYNAMIQUES ---------- */
views.proj = () => {
  const caps = D.settings.caps, mk = curMonth(), dom = parseD(today()).getDate(), dim = daysInMonth(mk);
  const sT = spentBetween(today(), today()), sW = spentBetween(weekStart(), today()), sM = spentBetween(mk + '-01', today());
  const vT = varSpentBetween(today(), today()), vW = varSpentBetween(weekStart(), today()), vM = varSpentBetween(mk + '-01', today());
  const t = today(), first = D.expenses.map(e => e.date).sort()[0];
  const span = first ? clamp(diffDays(first, t) + 1, 1, 30) : 1;
  const avg = spentBetween(addDays(t, -29), t) / span;
  const projM = dom ? sM / dom * dim : 0, expected = sum(D.sources, incomeNet);
  const hTotal = sum(D.habits, h => h.amount / PER[h.period]);
  const capRow = (label, sp, cap, hint) => {
    if (!cap) return `<div class="kv"><span>${label}</span><span><b>${fmt(sp)}</b> <span class="muted">· sans plafond</span></span></div>`;
    const p = sp / cap * 100;
    return `<div style="padding:8px 0"><div class="flex between" style="font-size:14px"><span>${label}</span><span><b class="${p > 100 ? 'neg' : ''}">${fmt(sp)}</b> / ${fmt(cap)}</span></div>
      <div class="mt-s">${progress(p, levelCls(p))}</div><div class="hint mt-s">${p > 100 ? `<span class="neg">⚠️ Dépassé de ${fmt(sp - cap)}</span>` : `Reste ${fmt(cap - sp)} ${hint}`}</div></div>`;
  };
  return `
  ${head('Module 4', 'Projections', 'Vos habitudes converties en jour, semaine, mois et année, avec des plafonds d’alerte.')}
  <div class="grid g2">
    <div class="card">
      <h2>Votre rythme réel</h2><p class="sub mt-s">Moyenne sur ${span} dernier(s) jour(s) de dépenses.</p>
      <div class="mini-grid mt">
        <div class="mini"><div class="k">Jour</div><div class="v">${fmt(avg)}</div></div>
        <div class="mini"><div class="k">Semaine</div><div class="v">${fmt(avg * 7)}</div></div>
        <div class="mini"><div class="k">Mois</div><div class="v">${fmt(avg * PER.mois)}</div></div>
        <div class="mini"><div class="k">An</div><div class="v">${fmt(avg * 365)}</div></div>
      </div>
      <div class="kv mt"><span>Dépensé ce mois (au ${dom})</span><b>${fmt(sM)}</b></div>
      <div class="kv"><span>Projection fin de mois</span><b class="${(caps.month && projM > caps.month) || (expected && projM > expected) ? 'neg' : ''}">${fmt(projM)}</b></div>
      ${expected ? `<div class="kv"><span>Revenus réguliers du mois</span><b class="pos">${fmt(expected)}</b></div>` : ''}
    </div>
    <div class="card">
      <h2>Plafonds de dépenses</h2><p class="sub mt-s">Ils portent sur les dépenses variables : loyer et factures n'y comptent pas.</p>
      <div class="mt">${capRow("Aujourd'hui", vT, caps.day, "pour aujourd'hui")}${capRow('Cette semaine', vW, caps.week, "jusqu'à dimanche")}${capRow('Ce mois', vM, caps.month, `pour ${dim - dom} jour(s)`)}</div>
      <form data-form="caps" class="mt">
        <div class="row3">
          ${field('Jour', amountInput('day', caps.day || '', 'placeholder="0"'))}
          ${field('Semaine', amountInput('week', caps.week || '', 'placeholder="0"'))}
          ${field('Mois', amountInput('month', caps.month || '', 'placeholder="0"'))}
        </div>
        <div class="flex mt wrap"><button class="btn btn-primary btn-sm">Enregistrer les plafonds</button><button type="button" class="btn btn-sm" data-action="caps-auto">Déduire du plafond mensuel</button></div>
        <p class="hint mt-s">0 ou vide = pas de plafond. « Déduire » calcule jour et semaine à partir du mois.</p>
      </form>
    </div>
  </div>
  <div class="grid g2 mt2">
    <div class="card">
      <h2>Convertisseur d'habitude</h2><p class="sub mt-s">Ex : 500 F de café par jour, combien par mois ?</p>
      <div class="row2 mt">
        ${field('Montant', `<input class="input" id="hAmt" data-live="habit" inputmode="decimal" placeholder="500">`)}
        ${field('Fréquence', `<select class="input" id="hPer" data-live="habit"><option value="jour">par jour</option><option value="semaine">par semaine</option><option value="mois">par mois</option></select>`)}
      </div>
      <div id="hOut" class="mt">${habitOut(0, 'jour')}</div>
      <div class="flex mt">${`<input class="input" id="hName" placeholder="Nom de l'habitude (ex : café)" maxlength="40">`}<button class="btn btn-primary" data-action="add-habit">Suivre</button></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Mes habitudes</h2>${D.habits.length ? `<span class="badge b-amber">${fmt(hTotal * PER.mois)} / mois</span>` : ''}</div>
      <div class="list">${D.habits.length ? D.habits.map(h => {
        const m = h.amount / PER[h.period] * PER.mois;
        return `<div class="item"><div class="item-main"><div class="item-title">${esc(h.name)}</div><div class="item-sub">${fmt(h.amount)} par ${h.period} · ${fmt(m * 12)} par an</div></div>

      }).join('') : empty('Aucune habitude suivie. Convertissez une dépense récurrente pour mesurer son vrai coût.')}</div>
      ${D.habits.length && expected ? `<p class="hint mt">Ces habitudes absorbent <b>${Math.round(hTotal * PER.mois / expected * 100)} %</b> de vos revenus réguliers, soit <b>${fmt(hTotal * 365)}</b> par an.</p>` : ''}
    </div>
  </div>`;
};
function habitOut(a, per) {
  const d = a / PER[per];

}

          <button class="btn btn-primary">Ajouter au simulateur</button>

      </div>
      <div class="card">
        <div class="card-head"><h2>Comparaison</h2></div>

          <span class="item-main"><span class="item-title" style="display:block">${esc(x.name)}</span><span class="item-sub ${x.type === 'revenu' ? 'pos' : 'neg'}">${x.type === 'revenu' ? '+' : '−'}${fmt(x.amount)}</span></span></label>
          <button class="btn btn-sm" data-action="scn-validate" data-id="${x.id}">Valider</button>
          <button class="icon-btn" data-action="scn-del" data-id="${x.id}">${icon('trash', 16)}</button></div>`).join('') : empty('Ajoutez plusieurs scénarios et cochez-les pour comparer.')}</div>
        ${D.scenarios.length ? `<div class="mt">
          <div class="kv"><span>Fin de mois sans scénario</span><b>${fmt(s.end)}</b></div>
          <div class="kv"><span>Impact des scénarios cochés</span><b class="${net < 0 ? 'neg' : 'pos'}">${net >= 0 ? '+' : ''}${fmt(net)}</b></div>
          <div class="kv total"><span>Fin de mois avec scénarios</span><span class="${withS < 0 ? 'neg' : 'pos'}">${fmt(withS)}</span></div>
          ${withS < 0 ? `<div class="alert alert-red mt">${icon('shield', 18)}<span>Cette combinaison vous met dans le rouge de ${fmt(-withS)}.</span></div>` : ''}
        </div>` : ''}
      </div>
    </div>
  </div>`;
};
function simVerdict(a) {
  const s = simBase(), after = s.end - a, em = emergencyBalance();
  const daysEq = s.daily > 0 ? a / s.daily : 0;
  let v;
  if (!a) v = ['blue', 'Saisissez un montant pour obtenir un verdict.'];
  else if (after < 0) v = ['red', `❌ Déconseillé : il vous manquerait ${fmt(-after)} en fin de mois.${em >= -after ? ' La caisse de secours pourrait couvrir, mais elle est réservée aux urgences.' : ''}`];
  else if (after < s.daily * 7) v = ['red', `⚠️ Risqué : il ne resterait que ${fmt(after)}, moins d'une semaine de dépenses.`];
  else if (after < s.daily * 15) v = ['amber', `Faisable mais tendu : il resterait ${fmt(after)} en fin de mois.`];
  else v = ['green', `✅ Faisable : il resterait ${fmt(after)} en fin de mois.`];
  return `<div class="alert alert-${v[0]}">${v[1]}</div>
    ${a ? `<div class="mt"><div class="kv"><span>Fin de mois après achat</span><b class="${after < 0 ? 'neg' : ''}">${fmt(after)}</b></div>
    <div class="kv"><span>Cet achat équivaut à</span><b>${daysEq.toFixed(1).replace('.', ',')} jour(s) d'autonomie</b></div>
    ${s.daily > 0 ? `<div class="kv"><span>Autonomie après achat</span><b>${Math.max(0, Math.floor((s.balance - a) / s.daily))} jour(s)</b></div>` : ''}</div>` : ''}`;
}

views.objectifs = () => `
  ${head('Module 9', 'Objectifs & projets personnels', 'Équipement, formation, projet : suivez chaque cible jusqu’au bout.', `<button class="btn btn-primary" data-action="add-goal">${icon('plus', 17)} Objectif</button>`)}
  ${D.goals.length ? `<div class="grid g3">${D.goals.map(goalCard).join('')}</div>`
    : `<div class="card">${empty('Aucun objectif pour l’instant. Exemple : ordinateur portable, 250 000 F avant juin.')}<div style="text-align:center"><button class="btn btn-primary" data-action="add-goal">Créer un objectif</button></div></div>`}`;

function goalCard(g) {
  const s = goalSaved(g), p = g.target ? s / g.target * 100 : 0, done = s >= g.target, rest = Math.max(0, g.target - s);
  let plan = '';
  if (!done && g.deadline) {
    const dl = diffDays(today(), g.deadline);
    if (dl < 0) plan = `<span class="neg">Échéance dépassée depuis ${-dl} jour(s).</span>`;
    else { const days = Math.max(dl, 1), perM = rest / Math.max(days / PER.mois, 1 / PER.mois * 7);
      plan = `Pour le ${dateLong(g.deadline)} : <b>${fmt(perM)}/mois</b> (${fmt(rest / days * 7)}/semaine)`; }
  }
  return `<div class="card">
    <div class="card-head"><div class="flex"><div class="item-ic">${g.icon || '🎯'}</div><div><h2>${esc(g.name)}</h2><div class="item-sub">Cible : ${fmt(g.target)}</div></div></div>
      ${done ? '<span class="badge b-green">🎉 Atteint</span>' : `<span class="badge b-violet">${Math.round(p)} %</span>`}</div>
    <div class="big-s">${fmt(s)}</div>
    <div class="mt-s">${progress(p, done ? 'ok' : '')}</div>
    <div class="hint mt-s">${done ? 'Objectif atteint, bravo !' : `Reste ${fmt(rest)}`}</div>
    ${plan ? `<div class="hint mt-s">${plan}</div>` : ''}
    <div class="flex mt wrap"><button class="btn btn-sm btn-primary" data-action="goal-move" data-id="${g.id}" data-dir="in">Verser</button>
      <button class="btn btn-sm" data-action="goal-move" data-id="${g.id}" data-dir="out">Retirer</button>
      <button class="icon-btn" data-action="edit-goal" data-id="${g.id}" style="margin-left:auto">${icon('edit', 16)}</button></div>
  </div>`;
}

/* ---------- MODULE 8 : BILAN DE FIN DE MOIS ---------- */
views.bilan = () => {
  const mk = state.bilanMonth, ms = monthStats(mk), prev = monthStats(shiftMonth(mk, -1));
  const rate = ms.inTotal > 0 ? (ms.inTotal - ms.exp) / ms.inTotal * 100 : null;
  const cats = Object.entries(ms.byCat).map(([id, v]) => ({c: catById(id), v})).sort((a, b) => b.v - a.v);
  const top = [...ms.expenses].sort((a, b) => b.amount - a.amount).slice(0, 5);
  const dExp = prev.exp ? (ms.exp - prev.exp) / prev.exp * 100 : null;
  const budgeted = D.categories.filter(c => c.budget > 0 || ms.byCat[c.id]);
  const byProj = {};
  ms.salesList.forEach(s => { const sv = D.services.find(x => x.id === s.serviceId); const k = sv ? sv.project : 'Autre'; byProj[k] = (byProj[k] || 0) + s.qty * s.price; });
  return `
  ${head('Module 8', 'Bilan & rétrospective', '', `${monthNav(mk, 'bm-prev', 'bm-next')}<button class="btn btn-sm" data-action="print">Imprimer / PDF</button>`)}
  <div class="grid g4">
    ${stat('Entrées', fmt(ms.inTotal), `revenus ${fmt(ms.inc)} · projets ${fmt(ms.sales)}`, 'pos')}
    ${stat('Sorties', fmt(ms.exp), dExp === null ? `${ms.count} opération(s)` : `${dExp > 0 ? '+' : ''}${Math.round(dExp)} % vs mois précédent`, 'neg')}
    ${stat('Mis de côté', fmt(ms.saved), `secours ${fmt(ms.em)} · objectifs ${fmt(ms.gl)}`)}
    ${stat("Taux d'épargne", rate === null ? '—' : Math.round(rate) + ' %', 'part des entrées non dépensée', rate === null ? '' : rate < 0 ? 'neg' : rate >= 20 ? 'pos' : 'warn')}
  </div>
  <div class="grid g2 mt2">
    <div class="card">
      <h2>Répartition des dépenses</h2>
      ${ms.exp ? `<div class="donut-wrap mt">${donut(cats, ms.exp)}
        <div class="legend">${cats.map((x, i) => `<div class="row"><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span><span class="nm">${x.c.icon} ${esc(x.c.name)}</span><b>${Math.round(x.v / ms.exp * 100)} %</b><span class="muted" style="min-width:76px;text-align:right">${fmt(x.v)}</span></div>`).join('')}</div></div>
        <div class="mt2"><div class="flex between" style="font-size:13px"><span>Fixes ${Math.round(ms.fixed / ms.exp * 100)} %</span><span>Variables ${Math.round(ms.variable / ms.exp * 100)} %</span></div>
        <div class="stackbar mt-s"><span style="width:${ms.fixed / ms.exp * 100}%;background:var(--blue)"></span><span style="width:${ms.variable / ms.exp * 100}%;background:var(--amber)"></span></div></div>`
        : empty('Aucune dépense ce mois-ci.')}
    </div>
    <div class="card">
      <h2>Analyse & conseils pour le mois suivant</h2>
      <div class="stack mt">${advice(ms, prev, rate, mk).map(([c, m]) => `<div class="alert alert-${c}"><span>${m}</span></div>`).join('')}</div>
    </div>
  </div>
  <div class="grid g2 mt2">
    <div class="card">
      <h2>Budget vs réel</h2>
      <div class="scroll-x mt"><table class="tbl"><thead><tr><th>Catégorie</th><th class="r">Budget</th><th class="r">Réel</th><th class="r">Écart</th></tr></thead><tbody>
      ${budgeted.length ? budgeted.map(c => { const r = ms.byCat[c.id] || 0, d = c.budget - r;
        return `<tr><td>${c.icon} ${esc(c.name)}</td><td class="r">${c.budget ? fmt(c.budget) : '—'}</td><td class="r">${fmt(r)}</td><td class="r ${c.budget ? (d < 0 ? 'neg' : 'pos') : 'muted'}">${c.budget ? (d >= 0 ? '+' : '') + fmt(d) : '—'}</td></tr>`; }).join('')
        : '<tr><td colspan="4" class="muted">Aucune donnée.</td></tr>'}
      </tbody></table></div>
    </div>
    <div class="card">
      <h2>Top 5 des dépenses</h2>
      <div class="list mt">${top.length ? top.map(expenseItem).join('') : empty('Rien à afficher.')}</div>
      ${Object.keys(byProj).length ? `<h2 class="mt2">Chiffre d'affaires par projet</h2><div class="mt">${Object.entries(byProj).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b class="pos">${fmt(v)}</b></div>`).join('')}</div>` : ''}
    </div>
  </div>`;
};
function donut(items, total) {
  let acc = 0;
  const segs = items.map((it, i) => {
    const p = it.v / total * 100;
    const s = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${COLORS[i % COLORS.length]}" stroke-width="6" stroke-dasharray="${p.toFixed(3)} ${(100 - p).toFixed(3)}" stroke-dashoffset="${(25 - acc).toFixed(3)}"/>`;
    acc += p; return s;
  }).join('');
  return `<svg viewBox="0 0 42 42" class="donut" role="img" aria-label="Répartition des dépenses"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--surface2)" stroke-width="6"/>${segs}
    <text x="21" y="21" text-anchor="middle" class="donut-t1">${fmtShort(total)}</text><text x="21" y="25.5" text-anchor="middle" class="donut-t2">F dépensés</text></svg>`;
}
function advice(ms, prev, rate, mk) {
  const a = [];
  if (!ms.inTotal && !ms.exp) return [['blue', 'Pas encore de données pour ce mois.']];
  if (rate !== null && rate < 0) a.push(['red', `Déficit de ${fmt(ms.exp - ms.inTotal)} : vous avez dépensé plus que vous n'avez gagné.`]);
  else if (rate !== null && rate < 10) a.push(['amber', `Taux d'épargne de ${Math.round(rate)} %. Visez au moins 10 % le mois prochain.`]);
  else if (rate !== null && rate >= 20) a.push(['green', `Excellent : ${Math.round(rate)} % de vos entrées n'ont pas été dépensées.`]);
  const vars = D.categories.filter(c => c.kind !== 'fixe').map(c => ({c, v: ms.byCat[c.id] || 0})).sort((x, y) => y.v - x.v);
  if (ms.exp && vars[0] && vars[0].v / ms.exp > 0.35) a.push(['amber', `${vars[0].c.icon} ${esc(vars[0].c.name)} pèse ${Math.round(vars[0].v / ms.exp * 100)} % de vos dépenses : c'est votre premier levier d'économie.`]);
  D.categories.filter(c => c.budget > 0 && (ms.byCat[c.id] || 0) > c.budget).forEach(c => a.push(['red', `${c.icon} ${esc(c.name)} : dépassement de ${fmt(ms.byCat[c.id] - c.budget)}. Ajustez le budget ou la consommation.`]));
  if (mk < curMonth()) D.categories.filter(c => c.kind !== 'fixe' && c.budget > 0 && (ms.byCat[c.id] || 0) < c.budget * 0.5)
    .slice(0, 2).forEach(c => a.push(['blue', `${c.icon} ${esc(c.name)} : moins de la moitié du budget utilisée. Budget à réduire au profit de l'épargne ?`]));
  if (prev.exp && ms.exp) { const d = (ms.exp - prev.exp) / prev.exp * 100; if (Math.abs(d) >= 10) a.push([d > 0 ? 'amber' : 'green', `Dépenses ${d > 0 ? 'en hausse' : 'en baisse'} de ${Math.abs(Math.round(d))} % par rapport au mois précédent.`]); }
  const target = essentialMonthly() * D.settings.emergencyMonths;
  if (target && emergencyBalance() < target && ms.em <= 0) a.push(['blue', `Rien n'a été versé dans la caisse de secours ce mois-ci. Même un petit montant régulier compte.`]);
  if (ms.sales && ms.inTotal) a.push(['green', `Vos projets représentent ${Math.round(ms.sales / ms.inTotal * 100)} % de vos entrées.`]);
  return a.length ? a : [['green', 'Mois équilibré, rien à signaler. Continuez ainsi.']];
}

    <input type="hidden" name="id" value="${i.id || ''}"><input type="hidden" name="mode" value="${mode}">
    <input type="hidden" name="sourceId" value="${i.sourceId || ''}"><input type="hidden" name="fromScenario" value="${i.fromScenario || ''}">
    ${field('Libellé', `<input class="input" name="label" required maxlength="60" value="${esc(i.label || '')}" placeholder="Ex : Bourse, salaire, aide…">`)}
    ${field('Type', `<select class="input" name="type">${INCOME_TYPES.map(t => `<option ${t === (i.type || 'Bourse') ? 'selected' : ''}>${t}</option>`).join('')}</select>`)}
    <div class="row2">${field('Montant', amountInput('amount', i.amount, 'required placeholder="0"'))}

    <div class="row3">${field('Taux (1 = ? F)', amountInput('rate', rate))}${field('Frais %', amountInput('feePct', i.feePct || 0))}${field('Frais fixes F', amountInput('feeFixed', i.feeFixed || 0))}</div>
    ${mode === 'receipt' ? field('Date de réception', `<input class="input" type="date" name="date" value="${i.date || today()}" required>`)
      : field('Jour habituel de réception (optionnel)', `<input class="input" type="number" name="day" min="1" max="31" value="${i.day || ''}" placeholder="Ex : 5">`)}

  $('#incPrev').innerHTML = `<div class="kv"><span>Brut converti</span><b>${fmt(incomeGross(x))}</b></div><div class="kv"><span>Frais</span><b class="neg">−${fmt(incomeGross(x) - incomeNet(x))}</b></div><div class="kv total"><span>Net reçu</span><span class="pos">${fmt(incomeNet(x))}</span></div>`;
}

  ${field('Service / prestation', `<input class="input" name="name" required maxlength="50" value="${esc(s.name || '')}" placeholder="Ex : Pack Lite, installation…">`)}

function openModal(title, body) {
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = body;
  $('#modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  const f = $('#modal-body input:not([type=hidden]):not([type=radio]):not([type=date])');
  if (f && window.matchMedia('(pointer:fine)').matches) setTimeout(() => f.focus(), 60);
}
function closeModal() { stopScan(); $('#modal').classList.remove('open'); $('#modal-body').innerHTML = ''; document.body.style.overflow = ''; }
function openIncome(i, mode, title) { openModal(title, incomeForm(i, mode)); incomePreview($('#modal-body form')); }

/* --- Traitement des formulaires --- */
const forms = {
  async activate(f) {
    const lic = getLic(), c = sigOf(f.code);
    if (!c) return renderLock("Collez votre code d'activation.");
    if (!(window.crypto && crypto.subtle)) return renderLock("Ouvrez l'application depuis son lien https pour l'activer.");
    if (await checkSig(c)) {
      lic.sig = c; try { localStorage.setItem(LIC_KEY, JSON.stringify(lic)); } catch (e) {}
      LIC_SIG_OK = true; unlockApp();
    } else renderLock("Code incorrect. Copiez-le en entier : il doit correspondre à ce code appareil.");
  },
  expense(f) {
    const amount = num(f.amount);
    if (amount <= 0) return toast('Montant invalide.', 'err');
    if (!f.catId) return toast('Choisissez une catégorie.', 'err');
    const data = {amount, catId: f.catId, note: (f.note || '').trim(), date: f.date || today()};
    state.lastCat = f.catId;
    if (f.id) { Object.assign(D.expenses.find(x => x.id === f.id), data); toast('Dépense modifiée.'); }
    else {
      D.expenses.push({id: uid(), ts: Date.now(), ...data});
      if (f.fromScenario) D.scenarios = D.scenarios.filter(s => s.id !== f.fromScenario);
      const c = catById(f.catId), sp = monthStats(data.date.slice(0, 7)).byCat[c.id] || 0;
      if (c.budget) toast(sp > c.budget ? `${c.icon} ${c.name} : enveloppe dépassée de ${fmt(sp - c.budget)}` : `−${fmt(amount)} · ${c.name} : reste ${fmt(c.budget - sp)}`, sp > c.budget ? 'warn' : '');
      else toast(`−${fmt(amount)} · solde : ${fmt(totals().balance)}`);
      const cap = D.settings.caps.day, sT = varSpentBetween(today(), today());
      if (cap && sT > cap && data.date === today()) setTimeout(() => toast(`Plafond du jour dépassé de ${fmt(sT - cap)}.`, 'err'), 400);
    }
    save(); closeModal(); render();
  },
  income(f) {
    const amount = num(f.amount);
    if (amount <= 0) return toast('Montant invalide.', 'err');
    const rate = f.currency === 'FCFA' ? 1 : num(f.rate);
    if (rate <= 0) return toast('Taux de change invalide.', 'err');
    if (f.currency !== 'FCFA') D.settings.rates[f.currency] = rate;
    const data = {label: f.label.trim(), type: f.type, amount, currency: f.currency, rate, feePct: num(f.feePct), feeFixed: num(f.feeFixed)};
    if (f.mode === 'source') {
      data.day = parseInt(f.day) || null;
      if (f.id) Object.assign(D.sources.find(x => x.id === f.id), data); else D.sources.push({id: uid(), ...data});
      toast('Source de revenu enregistrée.');
    } else {
      data.date = f.date || today();
      if (f.id) Object.assign(D.incomes.find(x => x.id === f.id), data);
      else {
        D.incomes.push({id: uid(), ts: Date.now(), sourceId: f.sourceId || null, ...data});
        if (f.fromScenario) D.scenarios = D.scenarios.filter(s => s.id !== f.fromScenario);
      }
      toast(`+${fmt(incomeNet(data))} encaissés.`);
    }
    save(); closeModal(); render();
  },
  service(f) {
    const price = num(f.price);
    if (price <= 0) return toast('Prix invalide.', 'err');
    const data = {project: f.project.trim(), name: f.name.trim(), price, cost: num(f.cost)};
    if (f.id) Object.assign(D.services.find(x => x.id === f.id), data); else D.services.push({id: uid(), ...data});
    save(); closeModal(); render(); toast('Service enregistré.');
  },
  saleN(f) {
    const qty = Math.round(num(f.qty)), s = D.services.find(x => x.id === f.id), price = num(f.price);
    if (!s || qty <= 0 || price < 0) return toast('Quantité invalide.', 'err');
    D.sales.push({id: uid(), serviceId: s.id, qty, price, cost: s.cost || 0, date: f.date || today()});
    save(); closeModal(); render(); toast(`+${qty} × ${s.name} = ${fmt(qty * price)}`);
  },
  cat(f) {
    const data = {name: f.name.trim(), icon: (f.icon || '📦').trim() || '📦', kind: f.kind, budget: num(f.budget)};
    if (f.id) Object.assign(D.categories.find(x => x.id === f.id), data); else D.categories.push({id: uid(), ...data});
    save(); closeModal(); render(); toast('Catégorie enregistrée.');
  },
  caps(f) {
    D.settings.caps = {day: num(f.day), week: num(f.week), month: num(f.month)};
    save(); render(); toast('Plafonds enregistrés.');
  },
  scenario(f) {
    const amount = num(f.amount);
    if (amount <= 0) return toast('Montant invalide.', 'err');
    D.scenarios.push({id: uid(), name: f.name.trim(), amount, type: f.type, active: true});
    save(); render();
  },
  emTarget(f) { D.settings.emergencyMonths = parseInt(f.months) || 3; save(); render(); toast('Objectif mis à jour.'); },
  emergency(f) {
    const amount = num(f.amount);
    if (amount <= 0) return toast('Montant invalide.', 'err');
    if (f.dir === 'in' && amount > totals().balance) return toast('Solde disponible insuffisant.', 'err');
    if (f.dir === 'out' && amount > emergencyBalance()) return toast('La caisse ne contient pas autant.', 'err');
    D.emergency.push({id: uid(), ts: Date.now(), date: today(), amount: f.dir === 'in' ? amount : -amount, note: (f.note || '').trim()});
    save(); closeModal(); render(); toast(f.dir === 'in' ? `🛡️ ${fmt(amount)} mis à l'abri.` : `${fmt(amount)} retirés de la caisse.`);
  },
  goal(f) {
    const target = num(f.target);
    if (target <= 0) return toast('Montant cible invalide.', 'err');
    const data = {name: f.name.trim(), icon: (f.icon || '🎯').trim() || '🎯', target, deadline: f.deadline || ''};
    if (f.id) Object.assign(D.goals.find(x => x.id === f.id), data); else D.goals.push({id: uid(), history: [], ...data});
    save(); closeModal(); render(); toast('Objectif enregistré.');
  },
  goalMove(f) {
    const g = D.goals.find(x => x.id === f.id), amount = num(f.amount);
    if (!g || amount <= 0) return toast('Montant invalide.', 'err');
    if (f.dir === 'in' && amount > totals().balance) return toast('Solde disponible insuffisant.', 'err');
    if (f.dir === 'out' && amount > goalSaved(g)) return toast('Montant supérieur à l’épargne de cet objectif.', 'err');
    g.history.push({id: uid(), date: today(), amount: f.dir === 'in' ? amount : -amount, note: (f.note || '').trim()});
    save(); closeModal(); render();
    toast(goalSaved(g) >= g.target ? `🎉 Objectif « ${g.name} » atteint !` : `${f.dir === 'in' ? '+' : '−'}${fmt(amount)} · ${g.name}`);
  },
  settings(f) {
    D.settings.initialBalance = num(f.initialBalance); D.settings.theme = f.theme;
    save(); applyTheme(); render(); toast('Réglages enregistrés.');
  },
  initial(f) { D.settings.initialBalance = num(f.initialBalance); save(); closeModal(); render(); toast('Solde de départ enregistré.'); },
  rates(f) {
    CURRENCIES.filter(c => c !== 'FCFA').forEach(c => { const v = num(f[c]); if (v > 0) D.settings.rates[c] = v; });
    save(); render(); toast('Taux enregistrés.');
  }
};

  'lock-guide': () => openModal('Découvrir Budget Flow', `<p class="sub" style="margin-bottom:14px">Gestion financière personnelle et suivi de petits projets, 100 % hors ligne et privée. Voici le guide complet :</p>${guideHtml(false)}`),
  'theme-toggle': () => { D.settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); if (state.view === 'reglages') render(); },

  'sale-plus': id => { const s = findIn(D.services, id); D.sales.push({id: uid(), serviceId: id, qty: 1, price: s.price, cost: s.cost || 0, date: today()}); save(); render(); toast(`+1 ${s.name} · +${fmt(s.price)}`); },
  'sale-minus': id => {
    const mk = curMonth(), list = D.sales.filter(s => s.serviceId === id && s.date.startsWith(mk));
    if (!list.length) return toast('Aucune vente ce mois-ci pour ce service.', 'warn');
    const last = list[list.length - 1];
    if (last.qty > 1) last.qty--; else D.sales = D.sales.filter(s => s !== last);
    save(); render();
  },
  'sale-n': id => { const s = findIn(D.services, id); openModal(`${s.name} : ajouter plusieurs ventes`, `<form data-form="saleN" class="stack"><input type="hidden" name="id" value="${id}">
    <div class="row2">${field('Volume (multiplicateur)', amountInput('qty', '', 'required placeholder="Ex : 4"'))}${field('Prix unitaire (F)', amountInput('price', s.price))}</div>
    ${field('Date', `<input class="input" type="date" name="date" value="${today()}">`)}<button class="btn btn-primary btn-block">Ajouter</button></form>`); },

  // Sorties
  'add-cat': id => openModal('Nouvelle catégorie', catForm({kind: id || 'variable'})),
  'edit-cat': id => openModal('Modifier la catégorie', catForm(findIn(D.categories, id))),
  'del-cat': id => { if (confirm('Supprimer cette catégorie ? Les dépenses associées seront conservées en « Sans catégorie ».')) { D.categories = D.categories.filter(c => c.id !== id); save(); closeModal(); render(); } },
  'pay-fixed': id => { const c = findIn(D.categories, id), sp = monthStats(curMonth()).byCat[id] || 0; openModal('Payer : ' + c.name, expenseForm({amount: Math.max(0, c.budget - sp), catId: id, note: c.name})); },

  // Projections
  'caps-auto': () => { const m = num(document.querySelector('[data-form=caps] [name=month]').value); if (!m) return toast('Saisissez d’abord un plafond mensuel.', 'warn');
    const f = document.querySelector('[data-form=caps]'); f.day.value = Math.round(m / PER.mois); f.week.value = Math.round(m / PER.mois * 7); },
  'add-habit': () => { const name = $('#hName').value.trim(), amount = num($('#hAmt').value);
    if (!name || amount <= 0) return toast('Indiquez un nom et un montant.', 'warn');
    D.habits.push({id: uid(), name, amount, period: $('#hPer').value}); save(); render(); toast('Habitude suivie.'); },
  'del-habit': id => { D.habits = D.habits.filter(h => h.id !== id); save(); render(); },

  // Simulateur
  'scn-toggle': id => { const s = findIn(D.scenarios, id); s.active = !s.active; save(); render(); },
  'scn-del': id => { D.scenarios = D.scenarios.filter(s => s.id !== id); save(); render(); },
  'scn-validate': id => { const s = findIn(D.scenarios, id);
    if (s.type === 'revenu') openIncome({label: s.name, type: 'Autre', amount: s.amount, currency: 'FCFA', fromScenario: s.id}, 'receipt', 'Valider le revenu');
    else openModal('Valider l’achat', expenseForm({amount: s.amount, note: s.name, fromScenario: s.id})); },

  // Caisse de secours
  'em-move': dir => openModal(dir === 'in' ? 'Verser dans la caisse' : 'Retrait d’urgence', moveForm('emergency', '', dir, 0, dir === 'in' ? `Disponible : ${fmt(totals().balance)}` : `Dans la caisse : ${fmt(emergencyBalance())}`)),
  'em-del': id => { if (confirm('Annuler ce mouvement ? Le montant revient à son point de départ.')) { D.emergency = D.emergency.filter(h => h.id !== id); save(); render(); } },

  // Objectifs
  'add-goal': () => openModal('Nouvel objectif', goalForm({})),
  'edit-goal': id => openModal('Modifier l’objectif', goalForm(findIn(D.goals, id))),
  'del-goal': id => { const g = findIn(D.goals, id), s = goalSaved(g);
    if (confirm(s > 0 ? `Supprimer « ${g.name} » ? Les ${fmt(s)} épargnés retourneront dans votre solde disponible.` : `Supprimer « ${g.name} » ?`)) { D.goals = D.goals.filter(x => x.id !== id); save(); closeModal(); render(); } },
  'goal-move': (id, el) => { const g = findIn(D.goals, id), dir = el.dataset.dir;
    openModal(`${dir === 'in' ? 'Verser vers' : 'Retirer de'} « ${g.name} »`, moveForm('goalMove', id, dir, 0, dir === 'in' ? `Disponible : ${fmt(totals().balance)}` : `Épargné : ${fmt(goalSaved(g))}`)); },

  // Bilan
  'bm-prev': () => { state.bilanMonth = shiftMonth(state.bilanMonth, -1); render(); },
  'bm-next': () => { state.bilanMonth = shiftMonth(state.bilanMonth, 1); render(); },

  // Sauvegarde
  export: () => {
    D.settings.lastBackup = today(); save();
    const blob = new Blob([JSON.stringify(D, null, 2)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `budget-flow-sauvegarde-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    render(); toast('Sauvegarde exportée.');
  },
  reset: () => {
    if (!confirm('Effacer TOUTES les données de Budget Flow ? Cette action est irréversible.')) return;
    if (prompt('Tapez EFFACER pour confirmer.') !== 'EFFACER') return toast('Réinitialisation annulée.');
    localStorage.removeItem(KEY); D = defaultData(); save(); applyTheme(); go('dash'); toast('Données effacées.');
  }
};

/* --- Calculs en direct (sans re-rendre la page, pour garder le focus) --- */
const live = {
  conv(t) {
    if (t.id === 'cvCur') $('#cvRate').value = D.settings.rates[t.value] || '';
    $('#cvOut').innerHTML = convHtml(num($('#cvAmt').value), $('#cvCur').value, num($('#cvRate').value), num($('#cvPct').value), num($('#cvFix').value));
  },
  habit() { $('#hOut').innerHTML = habitOut(num($('#hAmt').value), $('#hPer').value); },
  simtest(t) { $('#simOut').innerHTML = simVerdict(num(t.value)); },
  jq(t) { state.jq = t.value; $('#jList').innerHTML = journalList(); },
  jcat(t) { state.jcat = t.value; $('#jList').innerHTML = journalList(); },
  import(t) {
    const file = t.files && t.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.categories) || !Array.isArray(d.expenses)) throw new Error('format');
        if (!confirm('Remplacer les données actuelles par celles de la sauvegarde ?')) return;
        localStorage.setItem(KEY, JSON.stringify(d)); D = load(); save(); applyTheme(); render(); toast('Sauvegarde restaurée.');
      } catch (e) { toast('Fichier invalide : ce n’est pas une sauvegarde Budget Flow.', 'err'); }
    };
    r.readAsText(file); t.value = '';
  }
};

/* =========================================================================
   8. RENDU, NAVIGATION & ÉVÉNEMENTS
   ========================================================================= */
function render() {
  if (!isActivated()) return renderLock();
  if (!views[state.view]) state.view = 'dash';
  $('#view').innerHTML = views[state.view]();
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === state.view));
}
function go(v) {
  closeModal();
  if (location.hash.slice(1) !== v) location.hash = v; // déclenche hashchange → rendu
  else { state.view = v; render(); }
  window.scrollTo(0, 0);
}
function applyTheme() {
  const t = D.settings.theme;
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
function toast(msg, type = '') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  const box = $('#toasts'); box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2800);
}
function buildNav() {
  $('#brand-logo').innerHTML = icon('flow', 20);
  $('#modal-close').innerHTML = icon('x', 18);
  $('#side-install').innerHTML = installBtn('btn btn-sm btn-block');
  $('#sidebar-nav').innerHTML = VIEWS.map(v => `<button class="nav-btn" data-action="go" data-id="${v.id}" data-nav="${v.id}">${icon(v.icon)}<span>${v.label}</span></button>`).join('');
  const bn = (id, ic, l) => `<button class="bn-btn" data-action="go" data-id="${id}" data-nav="${id}">${icon(ic, 22)}<span>${l}</span></button>`;
  $('#bottomnav').innerHTML = bn('dash', 'home', 'Accueil') + bn('journal', 'journal', 'Journal') +
    `<button class="bn-add" data-action="quick-expense" aria-label="Nouvelle dépense">${icon('plus', 26)}</button>` +
    bn('entrees', 'in', 'Entrées') + `<button class="bn-btn" data-action="more">${icon('more', 22)}<span>Plus</span></button>`;
}

// Clics (délégation unique)
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (!fn) return;
  if (el.type !== 'checkbox') e.preventDefault();
  fn(el.dataset.id, el);
});
// Formulaires
document.addEventListener('submit', e => {
  const f = e.target, name = f.dataset.form; if (!name || !forms[name]) return;
  e.preventDefault();
  forms[name](Object.fromEntries(new FormData(f)), f);
});
// Saisie en direct
function onLive(e) {
  const t = e.target;
  if (t.form && t.form.dataset.form === 'income') {
    if (t.name === 'currency') t.form.rate.value = t.value === 'FCFA' ? 1 : (D.settings.rates[t.value] || '');
    incomePreview(t.form);
  }
  const l = t.dataset && t.dataset.live;
  if (l && live[l]) { if (l === 'import' && e.type !== 'change') return; live[l](t); }
}
document.addEventListener('input', onLive);
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' || e.target.type === 'file') onLive(e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal(); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1) || 'dash'; if (views[v]) { state.view = v; closeModal(); render(); window.scrollTo(0, 0); } });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
// Synchronisation si l'appli est ouverte dans deux onglets
window.addEventListener('storage', e => { if (e.key === KEY) { D = load(); render(); } });

/* =========================================================================
   9. DÉMARRAGE
   ========================================================================= */
(async function init() {
  const v = location.hash.slice(1);
  state.view = views[v] ? v : 'dash';
  const l = getLic();
  if (!legacyOk(l) && l.sig) LIC_SIG_OK = await checkSig(l.sig);
  buildNav(); applyTheme(); render();
})();
</script>
</body>
</html>
